<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Database Connection Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</h:head>

<h:body>
    <div class="container d-flex flex-column align-items-center justify-content-center vh-100">
        <div class="alert alert-danger text-center p-4 shadow-lg rounded">
            <h1 class="mb-3">Error</h1>
            <p class="mb-3">The webapp is temporarily unavailable.</p>
            <p>Please try refreshing the page later.</p>
            <h:form>
                <h:commandButton value="Refresh Page"
                                 styleClass="btn btn-danger mt-3"
                                 action="#{facesContext.externalContext.redirect(facesContext.externalContext.requestContextPath)}"/>
            </h:form>
        </div>
    </div>
</h:body>
</html>
